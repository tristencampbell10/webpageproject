<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0814"/>
      <stop offset="40%" stop-color="#140d28"/>
      <stop offset="70%" stop-color="#1a0b38"/>
      <stop offset="100%" stop-color="#06040a"/>
    </linearGradient>

    <!-- Purple Kinetic Glow Gradient -->
    <linearGradient id="vibraniumGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="wakandaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Silver Claw Gradient -->
    <linearGradient id="silverClaw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Deep Shadow Radial -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#centerGlow)"/>

  <!-- Wakandan Geometric Line Background Pattern -->
  <g stroke="#9333ea" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400"/>
    <path d="M 100 0 L 100 480 M 200 0 L 200 480 M 300 0 L 300 480 M 400 0 L 400 480 M 500 0 L 500 480 M 600 0 L 600 480 M 700 0 L 700 480"/>
    <!-- Subtle tribal chevrons -->
    <path d="M 400 40 L 480 80 L 400 120 L 320 80 Z"/>
    <path d="M 400 360 L 480 400 L 400 440 L 320 400 Z"/>
  </g>

  <!-- Central Black Panther Emblem / Mask Silhouette -->
  <g transform="translate(400, 195)">
    <!-- Aura halo -->
    <circle cx="0" cy="0" r="130" fill="#a855f7" opacity="0.08" filter="url(#superGlow)"/>
    <circle cx="0" cy="0" r="95" fill="#7e22ce" opacity="0.18" filter="url(#glow)"/>

    <!-- Mask Base Shape (Panther Face) -->
    <path d="M 0 -85 
             C 28 -85, 52 -70, 68 -50
             C 80 -35, 88 -15, 85 15
             C 82 45, 68 80, 48 102
             C 28 120, 10 128, 0 130
             C -10 128, -28 120, -48 102
             C -68 80, -82 45, -85 15
             C -88 -15, -80 -35, -68 -50
             C -52 -70, -28 -85, 0 -85 Z" 
          fill="#111319" stroke="#382952" stroke-width="3"/>

    <!-- Panther Ears -->
    <path d="M -50 -55 L -72 -100 L -32 -75 Z" fill="#181424" stroke="#7e22ce" stroke-width="2"/>
    <path d="M 50 -55 L 72 -100 L 32 -75 Z" fill="#181424" stroke="#7e22ce" stroke-width="2"/>
    <path d="M -48 -58 L -65 -92 L -36 -74 Z" fill="#3b0764"/>
    <path d="M 48 -58 L 65 -92 L 36 -74 Z" fill="#3b0764"/>

    <!-- Vibranium Kinetic Circuit Lines (Glowing Purple) -->
    <g stroke="url(#vibraniumGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <!-- Forehead Chevron -->
      <path d="M 0 -72 L 0 -25"/>
      <path d="M -22 -62 L 0 -42 L 22 -62"/>
      <path d="M -30 -42 L 0 -18 L 30 -42"/>
      
      <!-- Eye Accents & Contours -->
      <path d="M -52 -18 L -35 -14 L -18 -20"/>
      <path d="M 52 -18 L 35 -14 L 18 -20"/>
      <path d="M -48 6 L -32 4 L -15 -2"/>
      <path d="M 48 6 L 32 4 L 15 -2"/>

      <!-- Cheek & Jaw Lines -->
      <path d="M -60 18 L -42 45 L -18 75 L 0 85 L 18 75 L 42 45 L 60 18"/>
      <path d="M -35 48 L -20 70 L 0 78 L 20 70 L 35 48"/>
      
      <!-- Bridge & Nose -->
      <path d="M -12 12 L 0 24 L 12 12"/>
      <path d="M 0 24 L 0 45"/>
      <path d="M -8 45 L 0 52 L 8 45"/>
    </g>

    <!-- Fierce Glowing Eyes -->
    <polygon points="-46,-12 -22,-8 -32,-3" fill="#ffffff" filter="url(#glow)"/>
    <polygon points="46,-12 22,-8 32,-3" fill="#ffffff" filter="url(#glow)"/>
    <polygon points="-46,-12 -22,-8 -32,-3" fill="#e9d5ff"/>
    <polygon points="46,-12 22,-8 32,-3" fill="#e9d5ff"/>

    <!-- Vibranium Claw Necklace below mask -->
    <g transform="translate(0, 110)">
      <!-- Center Tooth -->
      <polygon points="0,0 -7,14 0,38 7,14" fill="url(#silverClaw)" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Inner Teeth -->
      <polygon points="-24,-5 -30,8 -20,28 -14,6" fill="url(#silverClaw)" stroke="#e2e8f0" stroke-width="0.8"/>
      <polygon points="24,-5 30,8 20,28 14,6" fill="url(#silverClaw)" stroke="#e2e8f0" stroke-width="0.8"/>
      <!-- Middle Teeth -->
      <polygon points="-48,-14 -54,-2 -44,18 -38,-4" fill="url(#silverClaw)" stroke="#cbd5e1" stroke-width="0.8"/>
      <polygon points="48,-14 54,-2 44,18 38,-4" fill="url(#silverClaw)" stroke="#cbd5e1" stroke-width="0.8"/>
      <!-- Outer Teeth -->
      <polygon points="-72,-25 -76,-15 -68,2 -63,-18" fill="url(#silverClaw)" stroke="#94a3b8" stroke-width="0.7"/>
      <polygon points="72,-25 76,-15 68,2 63,-18" fill="url(#silverClaw)" stroke="#94a3b8" stroke-width="0.7"/>
    </g>
  </g>

  <!-- Top Badge: Marvel Studios -->
  <g transform="translate(400, 48)">
    <rect x="-85" y="-14" width="170" height="28" rx="4" fill="#e11d48"/>
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">MARVEL STUDIOS</text>
  </g>

  <!-- Bottom Title Typography -->
  <g transform="translate(400, 395)">
    <!-- Movie Title -->
    <text x="0" y="0" font-family="'Trajan Pro', 'Cinzel', 'Times New Roman', Georgia, serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="9" text-anchor="middle" filter="url(#glow)">
      BLACK PANTHER
    </text>
    <text x="0" y="0" font-family="'Trajan Pro', 'Cinzel', 'Times New Roman', Georgia, serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="9" text-anchor="middle">
      BLACK PANTHER
    </text>

    <!-- Subtitle: Wakanda Forever & Favorite Movie Tag -->
    <text x="0" y="32" font-family="'Arial', 'Helvetica', sans-serif" font-size="13" font-weight="800" fill="url(#wakandaGold)" letter-spacing="6" text-anchor="middle">
      ★ WAKANDA FOREVER • MY FAVORITE MOVIE ★
    </text>
    <line x1="-160" y1="48" x2="160" y2="48" stroke="url(#vibraniumGlow)" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
